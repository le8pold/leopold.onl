<!DOCTYPE html>
<!-- V 1.3.2 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leopold.onl/transfer</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: white; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #gate { display: flex; flex-direction: column; align-items: center; gap: 20px; }
        input { height: 40px; padding: 0 5px; border: 2px solid black; font-size: 18px; text-align: center; width: 250px; outline: none; }
        button { width: 250px; height: 44px; font-size: 16px; border: 2px solid black; background: white; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        button:hover:not(:disabled) { background: black; color: white; }
        button.error-state { color: red; }
        button.success-state { color: green; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="gate">
        <div id="verifySection">
            <input type="password" id="pinInput" placeholder="PIN" maxlength="4">
            <button id="verifyBtn" onclick="verifyPin()">VERIFY</button>
        </div>
        <div id="mainForm" class="hidden">
            <input type="text" id="infoInput" placeholder="name" style="margin-bottom:20px">
            <input type="text" id="dataInput" placeholder="data">
            <button id="sendBtn" onclick="transferData()" style="margin-top:20px">TRANSFER</button>
        </div>
        <p style="font-size: 12px;">made by leo</p>
    </div>

    <script>
        const BASE_URL = 'https://transfer.hylton-leopold.workers.dev';
        let validatedPin = "";

        async function verifyPin() {
            const btn = document.getElementById("verifyBtn");
            const pin = document.getElementById("pinInput").value;
            btn.disabled = true; btn.textContent = "...";

            try {
                const res = await fetch(`${BASE_URL}/verify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin })
                });
                if (res.status === 401) throw new Error("BAD PIN");
                if (!res.ok) throw new Error("ERROR");

                validatedPin = pin;
                document.getElementById("verifySection").classList.add("hidden");
                document.getElementById("mainForm").classList.remove("hidden");
            } catch (e) {
                btn.classList.add("error-state"); btn.textContent = e.message;
                setTimeout(() => { btn.classList.remove("error-state"); btn.textContent = "VERIFY"; btn.disabled = false; }, 2000);
            }
        }

        async function transferData() {
            const btn = document.getElementById("sendBtn");
            const info = document.getElementById("infoInput").value;
            const secretData = document.getElementById("dataInput").value;
            btn.disabled = true; btn.textContent = "...";

            try {
                const res = await fetch(`${BASE_URL}/transfer`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin: validatedPin, info, secretData })
                });
                if (!res.ok) throw new Error();
                btn.classList.add("success-state"); btn.textContent = "DONE";
            } catch (e) {
                btn.classList.add("error-state"); btn.textContent = "FAILED";
            }
        }
    </script>
</body>
</html>
