<!DOCTYPE html>
<!-- V 1.3.2 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leopold.onl/retrieve</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #gate {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        #loginSection, #retrieveSection {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        input, select, button {
            width: 250px;
            box-sizing: border-box;
            height: 44px;
            border: 2px solid black;
            font-family: Arial, sans-serif;
            font-size: 16px;
            text-align: center;
            outline: none;
            background: white;
        }
        input, select {
            line-height: 40px;
            padding: 0 5px;
            display: block;
            text-transform: none; 
            caret-color: black; 
        }
        select {
            text-align-last: center;
            cursor: pointer;
            text-transform: uppercase;
        }
        input:focus::placeholder {
            color: transparent;
        }
        input::placeholder {
            color: black;
            opacity: 1;
            text-transform: uppercase;
        }
        input[readonly] {
            background-color: #f0f0f0;
            cursor: default;
        }
        button {
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
            padding: 0;
        }
        button:hover:not(:disabled) {
            background: black;
            color: white;
        }
        button:disabled {
            cursor: default;
            background: white;
            color: black;
        }
        button.error-state {
            color: rgb(255, 0, 0);
        }
        .hidden {
            display: none !important;
        }
        .footer-text {
            margin-top: 10px; 
            font-size: 14px; 
            color: black;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div id="gate">
        <div id="loginSection">
            <input type="password" id="pinInput" placeholder="password" maxlength="12">
            <button id="loadBtn" onclick="loadItems()">VERIFY</button>
        </div>
        <div id="retrieveSection" class="hidden">
            <select id="itemSelect" onchange="fetchSecret()">
                <option value="" disabled selected>SELECT AN ITEM...</option>
            </select>
            <input type="text" id="resultData" readonly placeholder="RESULT">
        </div>
        <p class="footer-text">made by leo</p>
    </div>

    <script>
        const BASE_URL = 'https://transfer.hylton-leopold.workers.dev';
        
        async function loadItems() {
            const btn = document.getElementById("loadBtn");
            const pin = document.getElementById("pinInput").value;
            if(!pin) return;
            btn.disabled = true;
            btn.textContent = "...";

            try {
                const res = await fetch(`${BASE_URL}/retrieve`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin })
                });
                if (res.status === 401) throw new Error("BAD PIN");
                if (!res.ok) throw new Error("ERROR");
                
                const items = await res.json();
                
                const select = document.getElementById("itemSelect");
                items.forEach(item => {
                    let opt = document.createElement("option");
                    opt.value = item.id; 
                    opt.textContent = item.info;
                    select.appendChild(opt);
                });

                document.getElementById("loginSection").classList.add("hidden");
                document.getElementById("retrieveSection").classList.remove("hidden");
            } catch (e) {
                btn.classList.add("error-state"); btn.textContent = e.message;
                setTimeout(() => { 
                    btn.disabled = false; 
                    btn.textContent = "VERIFY"; 
                    btn.classList.remove("error-state"); 
                }, 2000);
            }
        }

        async function fetchSecret() {
            const id = document.getElementById("itemSelect").value;
            const pin = document.getElementById("pinInput").value;
            const resField = document.getElementById("resultData");
            resField.value = "DECRYPTING...";

            try {
                const res = await fetch(`${BASE_URL}/decrypt`, {
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin, id })
                });
                const data = await res.json();
                resField.value = data.secretData;
            } catch (e) {
                resField.value = "ERROR DECRYPTING";
            }
        }
    </script>
</body>
</html>
