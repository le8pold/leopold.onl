<!DOCTYPE html>
<!--v1.0.0-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Counter</title>
  <style>
    body {
      background-color: #ffffff;
      color: #000000;
      font-family: monospace;
      margin: 0;
      padding: 40px;
    }
    .stats {
      display: flex;
      gap: 50px;
    }
    .num {
      font-size: 72px;
      margin-top: 10px;
    }
    .last-used {
      margin-top: 40px;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="stats">
    <div>
      <div>Total:</div>
      <div id="total" class="num">0</div>
    </div>
    <div>
      <div>Today:</div>
      <div id="today" class="num">0</div>
    </div>
  </div>

  <div class="last-used">
    Last pressed: <span id="lastPressed">Never</span>
  </div>

  <script>
    const WORKER_URL = "https://actionbuttoncounter.hylton-leopold.workers.dev";

    async function fetchStats() {
      try {
        const res = await fetch(WORKER_URL);
        const data = await res.json();
        
        document.getElementById('total').textContent = data.total_clicks ?? 0;
        document.getElementById('today').textContent = data.clicks_today ?? 0;
        
        if (data.last_pressed) {
          const date = new Date(data.last_pressed);
          document.getElementById('lastPressed').textContent = date.toLocaleString();
        } else {
          document.getElementById('lastPressed').textContent = "Never";
        }
      } catch (err) {
        console.error("Fetch error:", err);
      }
    }

    // Initial load
    fetchStats();

    // Fetch new stats every 2 seconds automatically in background
    setInterval(fetchStats, 2000);
  </script>

</body>
</html>
