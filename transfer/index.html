<!DOCTYPE html>
<!-- V 1.2.0 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>leopold.onl/transfer</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    #gate {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
    }
    input {
        height: 40px;
        line-height: 40px;
        padding: 0 5px;
        border: 2px solid black;
        font-size: 18px;
        text-align: center;
        outline: none;
        background: white;
        font-family: Arial, sans-serif;
        box-sizing: border-box;
        width: 250px;
    }
    button {
        width: 250px;
        height: 44px;
        padding: 10px;
        font-size: 16px;
        border: 2px solid black;
        background: white;
        cursor: pointer;
        font-family: Arial, sans-serif;
        text-transform: uppercase;
        transition: 0.2s;
        box-sizing: border-box;
    }
    button:hover:not(:disabled) {
        background: black;
        color: white;
    }
    button:disabled {
        cursor: default;
        background: white;
        color: black;
    }
    button.error-state { color: rgb(255, 0, 0); border-color: black; }
    button.success-state { color: rgb(0, 150, 0); border-color: black; }
    
    .hidden { display: none !important; }
</style>
</head>
<body>
<div id="gate">
    <div id="verifySection" style="display: flex; flex-direction: column; gap: 20px;">
        <input type="password" id="pinInput" placeholder="PIN" maxlength="4" onfocus="resetUI()">
        <button id="verifyBtn" onclick="verifyPin()">VERIFY</button>
    </div>

    <div id="mainForm" class="hidden" style="display: flex; flex-direction: column; gap: 20px;">
        <input type="text" id="infoInput" placeholder="name" onfocus="resetUI()">
        <input type="text" id="dataInput" placeholder="data" onfocus="resetUI()">
        <button id="sendBtn" onclick="transferData()">TRANSFER</button>
    </div>
    
    <p style="margin-top: 10px; font-size: 14px; color: black; font-family: Arial, sans-serif;">made by leo. data is stored in cloudlare KV storage.</p>
</div>
<script>
    const pinEl = document.getElementById("pinInput");
    const verifyBtn = document.getElementById("verifyBtn");
    const mainForm = document.getElementById("mainForm");
    const verifySection = document.getElementById("verifySection");
    
    const infoEl = document.getElementById("infoInput");
    const dataEl = document.getElementById("dataInput");
    const btnEl = document.getElementById("sendBtn");
    
    const WORKER_URL = 'https://transfer.hylton-leopold.workers.dev/transfer';
    let isProcessing = false;
    let validatedPin = "";

    function resetUI() {
        verifyBtn.textContent = "VERIFY";
        btnEl.textContent = "TRANSFER";
        [verifyBtn, btnEl].forEach(b => {
            b.disabled = false;
            b.classList.remove("error-state", "success-state");
        });
        isProcessing = false;
    }

    function verifyPin() {
        if (pinEl.value === "6767") {
            validatedPin = pinEl.value;
            verifySection.classList.add("hidden");
            mainForm.classList.remove("hidden");
        } else {
            verifyBtn.classList.add("error-state");
            verifyBtn.textContent = "BAD PIN";
        }
    }

    async function transferData() {
        const info = infoEl.value.trim();
        const secretData = dataEl.value.trim();
        
        if (isProcessing) return;
        if (!info || !secretData) {
            btnEl.classList.add("error-state");
            btnEl.textContent = "MISSING INFO";
            return;
        }
        
        isProcessing = true;
        btnEl.disabled = true;

        const frames = ['|', '/', '-', '\\'];
        let i = 0;
        const spinnerInterval = setInterval(() => {
            i = (i + 1) % frames.length;
            btnEl.textContent = frames[i];
        }, 100);

        try {
            const response = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pin: validatedPin, info, secretData })
            });
            
            if (!response.ok) throw new Error();

            clearInterval(spinnerInterval);
            btnEl.textContent = "DATA TRANSFERRED";
            btnEl.classList.add("success-state");
            infoEl.value = "";
            dataEl.value = "";

        } catch (error) {
            clearInterval(spinnerInterval);
            btnEl.classList.add("error-state");
            btnEl.textContent = "TRANSFER FAILED";
        }
    }

    pinEl.addEventListener("keypress", function(e) { if (e.key === "Enter") verifyPin(); });
    infoEl.addEventListener("keypress", function(e) { if (e.key === "Enter") transferData(); });
    dataEl.addEventListener("keypress", function(e) { if (e.key === "Enter") transferData(); });
</script>
</body>
</html>
