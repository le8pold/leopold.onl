<!DOCTYPE html>
<!-- v1.9.0 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>content</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Noto+Sans+JP:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Poppins", "Noto Sans JP", sans-serif;
    background: white;
    padding: 32px 32px 64px;
  }
  h1 {
    font-size: 36px;
    font-weight: bold;
    margin-bottom: 40px;
    letter-spacing: -1px;
  }
  .grid {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
  }
  .card {
    display: block;
    text-decoration: none;
    color: black;
    width: 293px;
    cursor: pointer;
  }
  .card-img {
    width: 293px;
    height: 220px;
    border: 2px solid black;
    background: #f0f0f0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .card-img .placeholder {
    font-size: 13px;
    color: #999;
    text-align: center;
    padding: 12px;
  }
  .card-label {
    margin-top: 8px;
    font-size: 15px;
    font-family: "Poppins", "Noto Sans JP", sans-serif;
  }
</style>
</head>
<body>
<a href="/" style="text-decoration: none; color: black;"><h1>leopold.onl</h1></a>
<div class="grid">
  <a class="card" href="/cube">
    <div class="card-img">
      <img src="cube.png" alt="cube">
    </div>
    <div class="card-label">cube.</div>
  </a>
  <a class="card" href="https://leo.hylton.onl">
    <div class="card-img">
      <img src="leohyltononl.png" alt="havrnt put photo yet">
    </div>
    <div class="card-label">leo.hylton.onl</div>
  </a>
  <a class="card" href="https://msg.hylton.onl">
    <div class="card-img">
      <img src="msg.png" alt="no foto either">
    </div>
    <div class="card-label">msg.hylton.onl</div>
  </a>
 <a class="card" href="/piano">
    <div class="card-img">
      <img src="piano.png" alt="piano">
    </div>
    <div class="card-label">piano.</div>
  </a>
 <a class="card" href="/away">
    <div class="card-img">
      <img src="dih.png" alt="away">
    </div>
    <div class="card-label">away counter.</div>
  </a>
  <a class="card" href="/transfer">
    <div class="card-img">
      <img src="dih.png" alt="transfer">
    </div>
    <div class="card-label">transfer text.</div>
  </a>
  <a class="card" href="/retrieve">
    <div class="card-img">
      <img src="dih.png" alt="retrieve">
    </div>
    <div class="card-label">retrieve text.</div>
  </a>
  <a class="card" href="/ascii">
    <div class="card-img">
      <img src="dih.png" alt="ascii vvido">
    </div>
    <div class="card-label">ascii video.</div>
  </a>
</div>
</body>
</html>
