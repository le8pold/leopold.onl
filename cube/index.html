<!DOCTYPE html>
<!-- v1.0.0 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ooo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; overflow: hidden; width: 100vw; height: 100vh; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, COLS, ROWS, FW, FH;
let ax = 0, ay = 0, az = 0;
let prevCells = new Set();

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  FW = window.innerWidth < 600 ? 10 : 14;
  FH = FW * 1.6;
  COLS = Math.ceil(W / FW);
  ROWS = Math.ceil(H / FH);
  prevCells = new Set();
  ctx.font = `${FH * 0.75}px monospace`;
  ctx.textBaseline = 'top';
  drawAll();
}

function drawAll() {
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#000';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      ctx.fillText('o', c * FW, r * FH);
    }
  }
}

function rotate(x, y, z, ax, ay, az) {
  let ny, nz, nx;
  ny = y * Math.cos(ax) - z * Math.sin(ax);
  nz = y * Math.sin(ax) + z * Math.cos(ax);
  y = ny; z = nz;
  nx = x * Math.cos(ay) + z * Math.sin(ay);
  nz = -x * Math.sin(ay) + z * Math.cos(ay);
  x = nx; z = nz;
  nx = x * Math.cos(az) - y * Math.sin(az);
  ny = x * Math.sin(az) + y * Math.cos(az);
  return [nx, ny, z];
}

function project(x, y, z) {
  const fov = Math.min(COLS, ROWS) * 1.2;
  const vz = fov * 1.5;
  const d = vz + z;
  const s = fov / (d < 0.001 ? 0.001 : d);
  const px = COLS / 2 + x * s * (FH / FW);
  const py = ROWS / 2 - y * s;
  return [px, py];
}

function lineCells(x0, y0, x1, y1) {
  const cells = [];
  const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  const steps = Math.max(dx, dy, 1);
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const col = Math.round(x0 + t * (x1 - x0));
    const row = Math.round(y0 + t * (y1 - y0));
    if (col >= 0 && col < COLS && row >= 0 && row < ROWS)
      cells.push(`${col},${row}`);
  }
  return cells;
}

const EDGES = [
  [0,1],[2,3],[4,5],[6,7],
  [0,2],[1,3],[4,6],[5,7],
  [0,4],[1,5],[2,6],[3,7]
];

function frame() {
  const size = Math.min(COLS, ROWS) * 0.28;

  const verts = [];
  for (const xi of [-1, 1])
    for (const yi of [-1, 1])
      for (const zi of [-1, 1]) {
        const [rx, ry, rz] = rotate(xi*size, yi*size, zi*size, ax, ay, az);
        verts.push(project(rx, ry, rz));
      }

  const newCells = new Set();
  for (const [a, b] of EDGES) {
    for (const key of lineCells(verts[a][0], verts[a][1], verts[b][0], verts[b][1]))
      newCells.add(key);
  }

  for (const key of newCells) {
    if (!prevCells.has(key)) {
      const [c, r] = key.split(',').map(Number);
      ctx.fillStyle = '#fff';
      ctx.fillRect(c * FW, r * FH, FW + 1, FH + 1);
    }
  }

  for (const key of prevCells) {
    if (!newCells.has(key)) {
      const [c, r] = key.split(',').map(Number);
      ctx.fillStyle = '#fff';
      ctx.fillRect(c * FW, r * FH, FW + 1, FH + 1);
      ctx.fillStyle = '#000';
      ctx.fillText('o', c * FW, r * FH);
    }
  }

  prevCells = newCells;
  ax += 0.03; ay += 0.05; az += 0.02;
  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
