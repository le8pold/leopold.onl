<!DOCTYPE html>
<!-- V 1.3.1 !-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leopold.onl/retrieve</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: white; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #gate { display: flex; flex-direction: column; align-items: center; gap: 20px; }
        input, select { height: 40px; border: 2px solid black; font-size: 16px; text-align: center; width: 250px; outline: none; }
        button { width: 250px; height: 44px; border: 2px solid black; background: white; cursor: pointer; text-transform: uppercase; }
        .hidden { display: none !important; }
        .error-state { color: red; }
    </style>
</head>
<body>
    <div id="gate">
        <div id="loginSection">
            <input type="password" id="pinInput" placeholder="PIN" maxlength="4">
            <button id="loadBtn" onclick="loadItems()">VERIFY</button>
        </div>
        <div id="retrieveSection" class="hidden">
            <select id="itemSelect" onchange="fetchSecret()">
                <option value="" disabled selected>Select an item...</option>
            </select>
            <input type="text" id="resultData" readonly style="margin-top:20px; background:#eee">
        </div>
        <p style="font-size: 12px;">made by leo</p>
    </div>

    <script>
        const BASE_URL = 'https://transfer.hylton-leopold.workers.dev';
        
        async function loadItems() {
            const btn = document.getElementById("loadBtn");
            const pin = document.getElementById("pinInput").value;
            btn.disabled = true;

            try {
                const res = await fetch(`${BASE_URL}/retrieve`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin })
                });
                if (res.status === 401) throw new Error("BAD PIN");
                const items = await res.json();
                
                const select = document.getElementById("itemSelect");
                items.forEach(item => {
                    let opt = document.createElement("option");
                    opt.value = item.id; opt.textContent = item.info;
                    select.appendChild(opt);
                });

                document.getElementById("loginSection").classList.add("hidden");
                document.getElementById("retrieveSection").classList.remove("hidden");
            } catch (e) {
                btn.classList.add("error-state"); btn.textContent = e.message;
                setTimeout(() => { btn.disabled = false; btn.textContent = "VERIFY"; btn.classList.remove("error-state"); }, 2000);
            }
        }

        async function fetchSecret() {
            const id = document.getElementById("itemSelect").value;
            const pin = document.getElementById("pinInput").value;
            const resField = document.getElementById("resultData");
            resField.value = "Decrypting...";

            const res = await fetch(`${BASE_URL}/decrypt`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pin, id })
            });
            const data = await res.json();
            resField.value = data.secretData;
        }
    </script>
</body>
</html>
