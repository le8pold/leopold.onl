<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>leopold.onl</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Noto+Sans+JP:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Poppins", "Noto Sans JP", sans-serif;
      background: black;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
    }

    .content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      mix-blend-mode: difference;
      color: white;
    }

    h1 {
      font-size: 3rem;
      font-weight: 600;
      letter-spacing: 2px;
    }

    .links {
      margin-top: 20px;
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    a {
      text-decoration: none;
      font-size: 0.9rem;
      color: white;
      opacity: 0.8;
      transition: opacity 0.2s ease;
    }

    a:hover {
      opacity: 1;
    }

  </style>
</head>
<body>

<canvas id="shader"></canvas>

<div class="content">
  <h1>leopold</h1>
  <div class="links">
    <a href="/about/">about</a>
    <a href="/content/">content</a>
    <a href="https://tiktok.com/le8pold">tiktok</a>
    <a href="https://instagram.com/le8pold">instagram</a>
    <a href="https://github.com/le8pold">github</a>
    <a href="mailto:hylton.leopold@gmail.com">email</a>
  </div>
</div>

<script>
const canvas = document.getElementById('shader');
const gl = canvas.getContext('webgl');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);
}
window.addEventListener('resize', resize);
resize();

const vertex = `
attribute vec2 position;
void main() {
  gl_Position = vec4(position, 0.0, 1.0);
}`;

const fragment = `
precision mediump float;
uniform float time;
uniform vec2 resolution;
uniform vec2 mouse;

void main() {
  vec2 uv = gl_FragCoord.xy / resolution;

  // Center UV like original shader feel
  vec2 centered = uv - 0.5;

  // ORIGINAL STYLE (smooth flowing, not grid)
  float noise = sin(centered.x * 10.0 + time) * 0.1;
  noise += cos(centered.y * 8.0 + time * 1.5) * 0.05;

  float noise2 = sin(centered.x * 6.0 - time * 0.5) * cos(centered.y * 6.0 + time * 0.3);

  float combined = noise + noise2 * 0.5;

  // Mouse glow (soft, not dominant)
  float d = distance(uv, mouse);
  float glow = 1.0 - smoothstep(0.0, 0.5, d);

  vec3 col = vec3(0.0);
  col += vec3(0.15 + combined);
  col += glow * 0.25;

  gl_FragColor = vec4(col, 1.0);
}`;

function createShader(type, source) {
  const s = gl.createShader(type);
  gl.shaderSource(s, source);
  gl.compileShader(s);
  return s;
}

const program = gl.createProgram();
gl.attachShader(program, createShader(gl.VERTEX_SHADER, vertex));
gl.attachShader(program, createShader(gl.FRAGMENT_SHADER, fragment));
gl.linkProgram(program);
gl.useProgram(program);

const buffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
  -1, -1,
   1, -1,
  -1,  1,
   1,  1
]), gl.STATIC_DRAW);

const pos = gl.getAttribLocation(program, 'position');
gl.enableVertexAttribArray(pos);
gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

const timeLoc = gl.getUniformLocation(program, 'time');
const resLoc = gl.getUniformLocation(program, 'resolution');
const mouseLoc = gl.getUniformLocation(program, 'mouse');

let mouse = [0.5, 0.5];
window.addEventListener('mousemove', (e) => {
  mouse = [e.clientX / canvas.width, 1.0 - e.clientY / canvas.height];
});

function render(t) {
  gl.uniform1f(timeLoc, t * 0.001);
  gl.uniform2f(resLoc, canvas.width, canvas.height);
  gl.uniform2f(mouseLoc, mouse[0], mouse[1]);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(render);
}

requestAnimationFrame(render);
</script>

</body>
</html>
