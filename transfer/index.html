<!DOCTYPE html>
<!-- V 1.3.3 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leopold.onl/transfer</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #gate {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        #verifySection, #mainForm {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        input {
            width: 250px;
            box-sizing: border-box;
            height: 44px;
            line-height: 40px;
            padding: 0 5px;
            border: 2px solid black;
            font-size: 24px;
            text-align: center;
            outline: none;
            background: white;
            display: block;
            font-family: Arial, sans-serif;
        }
        button {
            width: 250px;
            box-sizing: border-box;
            height: 44px;
            padding: 10px;
            font-size: 16px;
            border: 2px solid black;
            background: white;
            cursor: pointer;
            font-family: Arial, sans-serif;
            text-transform: uppercase;
            transition: 0.2s;
        }
        button:hover:not(:disabled) {
            background: black;
            color: white;
        }
        button:disabled {
            cursor: default;
            background: white;
            color: black;
        }
        button.error-state {
            color: rgb(255, 0, 0);
            border-color: black;
        }
        button.success-state {
            color: rgb(0, 128, 0);
            border-color: black;
        }
        .hidden {
            display: none !important;
        }
        .footer-text {
            margin-top: 10px; 
            font-size: 14px; 
            color: black; 
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div id="gate">
        <div id="verifySection">
            <input type="password" id="pinInput" placeholder="PIN" maxlength="4">
            <button id="verifyBtn" onclick="verifyPin()">VERIFY</button>
        </div>
        <div id="mainForm" class="hidden">
            <input type="text" id="infoInput" placeholder="name">
            <input type="text" id="dataInput" placeholder="data">
            <button id="sendBtn" onclick="transferData()">TRANSFER</button>
        </div>
        <p class="footer-text">made by leo</p>
    </div>

    <script>
        const BASE_URL = 'https://transfer.hylton-leopold.workers.dev';
        let validatedPin = "";

        async function verifyPin() {
            const btn = document.getElementById("verifyBtn");
            const pin = document.getElementById("pinInput").value;
            btn.disabled = true; btn.textContent = "...";

            try {
                const res = await fetch(`${BASE_URL}/verify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin })
                });
                if (res.status === 401) throw new Error("BAD PIN");
                if (!res.ok) throw new Error("ERROR");

                validatedPin = pin;
                document.getElementById("verifySection").classList.add("hidden");
                document.getElementById("mainForm").classList.remove("hidden");
            } catch (e) {
                btn.classList.add("error-state"); btn.textContent = e.message;
                setTimeout(() => { btn.classList.remove("error-state"); btn.textContent = "VERIFY"; btn.disabled = false; }, 2000);
            }
        }

        async function transferData() {
            const btn = document.getElementById("sendBtn");
            const info = document.getElementById("infoInput").value;
            const secretData = document.getElementById("dataInput").value;
            btn.disabled = true; btn.textContent = "...";

            try {
                const res = await fetch(`${BASE_URL}/transfer`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin: validatedPin, info, secretData })
                });
                if (!res.ok) throw new Error();
                btn.classList.add("success-state"); btn.textContent = "DONE";
            } catch (e) {
                btn.classList.add("error-state"); btn.textContent = "FAILED";
                setTimeout(() => { btn.classList.remove("error-state"); btn.textContent = "TRANSFER"; btn.disabled = false; }, 2000);
            }
        }
    </script>
</body>
</html>
