<!DOCTYPE html>
<!-- v1.0.1 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ooo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; overflow: hidden; width: 100vw; height: 100vh; touch-action: none; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const bgCanvas = document.createElement('canvas');
const bgCtx = bgCanvas.getContext('2d');
let W, H, COLS, ROWS, FW, FH;
let ax = 0, ay = 0, az = 0;
let scrollY = 0;
let isDragging = false;
let lastX = 0, lastY = 0;
let vx = 0, vy = 0, vz = 0;
let targetVx = 0.003, targetVy = 0.005, targetVz = 0.002;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  FW = window.innerWidth < 600 ? 10 : 14;
  FH = FW * 1.6;
  COLS = Math.ceil(W / FW);
  ROWS = Math.ceil(H / FH);
  bgCanvas.width = W;
  bgCanvas.height = (ROWS + 2) * FH;
  bgCtx.fillStyle = '#fff';
  bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
  bgCtx.fillStyle = '#000';
  bgCtx.font = `${FH * 0.75}px monospace`;
  bgCtx.textBaseline = 'top';
  for (let r = 0; r <= ROWS + 1; r++) {
    for (let c = 0; c < COLS; c++) {
      bgCtx.fillText('o', c * FW, r * FH);
    }
  }
}
function rotate(x, y, z, ax, ay, az) {
  let ny, nz, nx;
  ny = y * Math.cos(ax) - z * Math.sin(ax);
  nz = y * Math.sin(ax) + z * Math.cos(ax);
  y = ny; z = nz;
  nx = x * Math.cos(ay) + z * Math.sin(ay);
  nz = -x * Math.sin(ay) + z * Math.cos(ay);
  x = nx; z = nz;
  nx = x * Math.cos(az) - y * Math.sin(az);
  ny = x * Math.sin(az) + y * Math.cos(az);
  return [nx, ny, z];
}
function project(x, y, z) {
  const fov = Math.min(COLS, ROWS) * 1.2;
  const vz = fov * 1.5;
  const d = vz + z;
  const s = fov / (d < 0.001 ? 0.001 : d);
  const px = COLS / 2 + x * s * (FH / FW);
  const py = ROWS / 2 - y * s;
  return [px, py];
}
function lineCells(x0, y0, x1, y1) {
  const cells = [];
  const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  const steps = Math.max(dx, dy, 1);
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const col = Math.round(x0 + t * (x1 - x0));
    const row = Math.round(y0 + t * (y1 - y0));
    if (col >= 0 && col < COLS && row >= 0 && row < ROWS)
      cells.push(`${col},${row}`);
  }
  return cells;
}
const EDGES = [
  [0,1],[2,3],[4,5],[6,7],
  [0,2],[1,3],[4,6],[5,7],
  [0,4],[1,5],[2,6],[3,7]
];
window.addEventListener('wheel', (e) => {
  scrollY += e.deltaY * 0.5;
});
function handleDragStart(x, y) {
  isDragging = true;
  lastX = x;
  lastY = y;
  vx = 0; vy = 0; vz = 0;
}
function handleDragMove(x, y) {
  if (!isDragging) return;
  const dx = x - lastX;
  const dy = y - lastY;
  const rotSpeed = 0.008;
  ay += dx * rotSpeed;
  ax += dy * rotSpeed;
  vy = dx * rotSpeed;
  vx = dy * rotSpeed;
  vz = 0;

  lastX = x;
  lastY = y;
}
function handleDragEnd() {
  isDragging = false;
}
canvas.addEventListener('mousedown', e => { if (e.button === 0) handleDragStart(e.clientX, e.clientY); });
window.addEventListener('mousemove', e => handleDragMove(e.clientX, e.clientY));
window.addEventListener('mouseup', e => { if (e.button === 0) handleDragEnd(); });
canvas.addEventListener('touchstart', e => handleDragStart(e.touches[0].clientX, e.touches[0].clientY));
window.addEventListener('touchmove', e => handleDragMove(e.touches[0].clientX, e.touches[0].clientY));
window.addEventListener('touchend', handleDragEnd);
function frame() {
  let offset = scrollY % FH;
  if (offset < 0) offset += FH;
  ctx.drawImage(bgCanvas, 0, -offset);
  const size = Math.min(COLS, ROWS) * 0.28;
  const verts = [];
  for (const xi of [-1, 1])
    for (const yi of [-1, 1])
      for (const zi of [-1, 1]) {
        const [rx, ry, rz] = rotate(xi*size, yi*size, zi*size, ax, ay, az);
        verts.push(project(rx, ry, rz));
      }
  const currentCells = new Set();
  for (const [a, b] of EDGES) {
    for (const key of lineCells(verts[a][0], verts[a][1], verts[b][0], verts[b][1]))
      currentCells.add(key);
  }
  ctx.fillStyle = '#fff';
  for (const key of currentCells) {
    const [c, r] = key.split(',').map(Number);
    ctx.fillRect(c * FW, r * FH, FW + 1, FH + 1);
  }
  if (!isDragging) {
    ax += vx;
    ay += vy;
    az += vz;
    vx += (targetVx - vx) * 0.02;
    vy += (targetVy - vy) * 0.02;
    vz += (targetVz - vz) * 0.02;
    if (Math.random() < 0.01) {
      targetVx = (Math.random() - 0.5) * 0.015;
      targetVy = (Math.random() - 0.5) * 0.015;
      targetVz = (Math.random() - 0.5) * 0.015;
    }
  }
  requestAnimationFrame(frame);
}
window.addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
